# 项目相关配置
ruoyi:
  # 名称
  name: 江城数字孪生运管平台
  # 版本
  version: 4.8.3
  # 版权年份
  copyrightYear: 2026
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 90
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
 
# 日志配置
logging:
  level:
    com.ruoyi: debug
    com.ruoyi.twin: info
    com.ruoyi.twin.simulator: warn
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: static/i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB

# MyBatis
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  # MySQL 时为 mysql
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Shiro
shiro:
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: true
    # 验证码类型 math 数字计算 char 字符验证
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain:
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
    # 设置密钥，务必保持唯一性（生成方式，直接拷贝到main运行即可）Base64.encodeToString(CipherUtils.generateNewKey(128, "AES").getEncoded()) （默认启动生成随机秘钥，随机秘钥会导致之前客户端RememberMe Cookie无效，如设置固定秘钥RememberMe Cookie则有效）
    cipherKey:
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    expireTime: 30
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false
  rememberMe:
    # 是否开启记住我
    enabled: true

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 数字孪生配置
app:
  tileset:
    # 相对路径，由若依从磁盘目录同源静态托管；
    # 留空则 tileset-info 返回 null，前端走 GeoJSON 降级
    url: /twin/tiles/tileset.json
    # 三维切片体积较大，不打进 jar；目录末尾必须保留斜杠
    location: D:/ruoyi/twinTiles/
    # 相机位置是视点而非注视点，视线沿 pitch 方向落在其正北某处。
    # 【重要】不要用平面几何 h/tan(|pitch|) 推算落点——22 km 以上高度地球曲率显著，
    # 实测落点只有平面几何预测的 0.61 倍（视点 lat 30.3472 / h 22000 / pitch -45
    # 纸面算落点 lat 30.546，实测屏幕中心却在 lat 30.469，偏差 8.5 km，
    # 曾导致初始视角完全看不到白模）。故本组数按实测系数 0.6122 反解标定：
    #   目标落点 = tileset root region 中心 lon 114.2987 / lat 30.5443
    #   （即 frontend/public/tiles/tileset.json 的 boundingVolume.region 中心，
    #     lon 113.97129~114.62613 / lat 30.38754~30.70105，不是建筑密度区中心）
    #   h 28000 / pitch -55 => 实际推进 12.0 km => 视点 lat 30.5443 - 12.0/110.57
    # 该组合下视锥在落点处半宽 35.1 km / 半高 19.7 km，足以覆盖 62.8 x 34.7 km 的
    # 数据范围（需 33.0 / 18.2），且视点纬度落在数据范围内而非悬在南侧外
    camera:
      lon: 114.2987
      lat: 30.4357
      height: 28000
      heading: 0
      pitch: -55
  building:
    # GeoJSON 单次返回要素上限。范围扩至七区后全域近 3 万栋，降级路径已强制要求
    # 带 bbox 只服务当前视野，此上限仅用于兜住单个视野内的极端密集情形；
    # 上限继续抬高会让单次响应超过 10 MB，届时应改走 3D Tiles 而非再调此值
    geojson-max-features: 12000
  simulator:
    # 关闭后不注册调度线程，实时表停止刷新但接口仍可读历史值
    enabled: true
    # 调度周期，单位毫秒，与 docs 约定的 3 秒推送节奏一致
    fixed-rate: 3000
    # 单设备单次调度的告警概率，约 650 台在线设备约每分钟 26 条
    alarm-probability: 0.002
    # 每 20 次调度（60 秒）落一批历史遥测
    telemetry-tick-interval: 20
    # 市政设施调度周期，比设备慢一倍，设施数量更多但变化更缓
    facility-fixed-rate: 6000
    # 单设施单次调度的告警概率，室外设施故障率低于楼内设备
    facility-alarm-probability: 0.001

# 防止csrf攻击
csrf:
  # 过滤开关
  enabled: false
  # 白名单（多个用逗号分隔）
  whites: /druid
