<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改建筑')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-building-edit" th:object="${building}">
            <input name="id" type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label class="col-sm-3 control-label">建筑名称：</label>
                <div class="col-sm-8"><input class="form-control" type="text" name="name" maxlength="128" th:field="*{name}"></div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">建筑类型：</label>
                <div class="col-sm-8"><input class="form-control" type="text" name="buildingType" maxlength="32" th:field="*{buildingType}"></div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">层数：</label>
                <div class="col-sm-8"><input class="form-control" type="number" name="levels" min="1" max="500" th:field="*{levels}"></div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">高度（米）：</label>
                <div class="col-sm-8"><input class="form-control" type="number" name="height" min="0.1" max="9999.99" step="0.01" th:field="*{height}" required></div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">高度来源：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="heightSource" th:field="*{heightSource}" required>
                        <option value="osm_height">OSM 高度</option>
                        <option value="osm_levels">OSM 层数</option>
                        <option value="default_by_type">按类型默认</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">经度：</label>
                <div class="col-sm-8"><input class="form-control" type="number" name="lon" min="-180" max="180" step="0.000001" th:field="*{lon}" required></div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">纬度：</label>
                <div class="col-sm-8"><input class="form-control" type="number" name="lat" min="-90" max="90" step="0.000001" th:field="*{lat}" required></div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script>
        var prefix = ctx + "twin/building";
        $("#form-building-edit").validate({focusCleanup: true});

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-building-edit').serialize());
            }
        }
    </script>
</body>
</html>
