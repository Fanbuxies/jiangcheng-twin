<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('修改设备')" /></head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-device-edit" th:object="${device}">
            <input name="id" type="hidden" th:field="*{id}"/>
            <div class="form-group"><label class="col-sm-3 control-label is-required">设备编号：</label><div class="col-sm-8"><input class="form-control" name="deviceCode" maxlength="64" th:field="*{deviceCode}" required></div></div>
            <div class="form-group"><label class="col-sm-3 control-label">设备名称：</label><div class="col-sm-8"><input class="form-control" name="deviceName" maxlength="128" th:field="*{deviceName}"></div></div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">设备类型：</label>
                <div class="col-sm-8"><select class="form-control" name="deviceType" th:field="*{deviceType}" required><option value="SMOKE">烟感</option><option value="WATER">水浸</option><option value="TEMP_HUMI">温湿度</option><option value="ELECTRIC">电气</option><option value="CAMERA">摄像头</option></select></div>
            </div>
            <div class="form-group"><label class="col-sm-3 control-label is-required">所属建筑：</label><div class="col-sm-8"><input class="form-control" type="number" name="buildingId" min="1" th:field="*{buildingId}" required></div></div>
            <div class="form-group"><label class="col-sm-3 control-label">楼层：</label><div class="col-sm-8"><input class="form-control" type="number" name="floor" min="-50" max="500" th:field="*{floor}"></div></div>
            <div class="form-group"><label class="col-sm-3 control-label">安装高度（米）：</label><div class="col-sm-8"><input class="form-control" type="number" name="altitude" min="0" max="9999.99" step="0.01" th:field="*{altitude}"></div></div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">状态：</label>
                <div class="col-sm-8"><select class="form-control" name="status" th:field="*{status}" required><option value="ONLINE">在线</option><option value="OFFLINE">离线</option><option value="FAULT">故障</option></select></div>
            </div>
            <div class="form-group"><label class="col-sm-3 control-label is-required">经度：</label><div class="col-sm-8"><input class="form-control" type="number" name="lon" min="-180" max="180" step="0.000001" th:field="*{lon}" required></div></div>
            <div class="form-group"><label class="col-sm-3 control-label is-required">纬度：</label><div class="col-sm-8"><input class="form-control" type="number" name="lat" min="-90" max="90" step="0.000001" th:field="*{lat}" required></div></div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script>
        var prefix = ctx + "twin/device";
        $("#form-device-edit").validate({focusCleanup: true});
        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-device-edit').serialize());
            }
        }
    </script>
</body>
</html>
